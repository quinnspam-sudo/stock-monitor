name: discover

# Triggered externally via cron-job.org calling this workflow's
# workflow_dispatch REST endpoint on a schedule (see CRON_TRIGGERS.md) —
# GitHub's native `schedule:` trigger was silently not firing on this new
# account/repo (a known GitHub anti-abuse throttle on brand-new accounts),
# while manual/API dispatch worked reliably, so scheduling is now driven
# externally instead.

# Weekly watchlist discovery: draws in new names on the rigorous-but-optimistic
# gate and prunes structurally-dead ones. Suggested slot: Saturday 09:30 PT —
# AFTER Friday's weekly.py refreshes watchlist_health.json (the prune input) and
# 30 min after Saturday's backtest.yml, so the two weekend yfinance-heavy runs
# don't overlap or compete with the weekday monitor/options runs.
on:
  workflow_dispatch: {}

concurrency:
  group: stock-monitor-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: America/Los_Angeles
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python discover.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_UPDATES_WEBHOOK_URL: ${{ secrets.DISCORD_UPDATES_WEBHOOK_URL }}
      - name: Commit updated state
        run: |
          git config user.name "stock-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          # Explicit allowlist, not `git add -A` — only files discover.py is known to write.
          STATE_FILES="config.json discover_log.json discover_state.json scores.json history.json obsidian_queue.jsonl"
          git add $STATE_FILES
          git diff --cached --quiet || git commit -m "discover: state update [skip ci]"
          pushed=""
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash && git push; then pushed=yes; break; fi
            # Same conflict-recovery as the other workflows: a conflicted rebase
            # leaves unmerged files that doom every retry; rebuild our state
            # commit on top of fresh remote (our regenerated state wins by design).
            git rebase --abort 2>/dev/null || true
            OLD=$(git rev-parse HEAD)
            FILES=$(git show --name-only --format= "$OLD")
            git fetch origin main
            git reset --hard origin/main
            if [ -n "$FILES" ]; then git checkout "$OLD" -- $FILES 2>/dev/null || true; fi
            git add $FILES
            git diff --cached --quiet || git commit -m "state update after conflict [skip ci]"
            echo "push attempt $i failed, retrying..."
            sleep $((i * 5))
          done
          if [ -z "$pushed" ]; then
            echo "::error::state commit could not be pushed after 5 attempts — state from this run is lost"
            exit 1
          fi
