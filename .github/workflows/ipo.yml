name: ipo

# Mirrors com.stockmonitor.ipo.plist: daily 5:30 PT (EDGAR S-1/424B4 scan).
on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch: {}

concurrency:
  group: stock-monitor-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python ipo.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Commit updated state
        run: |
          git config user.name "stock-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- . ':!venv' ':!__pycache__'
          git diff --cached --quiet || git commit -m "ipo: state update [skip ci]"
          git pull --rebase --autostash
          git push
