name: close

# Mirrors com.stockmonitor.close.plist: 13:35 PT, Mon-Fri (post 4:30pm ET bell).
on:
  schedule:
    - cron: "35 20 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: stock-monitor-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python close.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Commit updated state
        run: |
          git config user.name "stock-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- . ':!venv' ':!__pycache__'
          git diff --cached --quiet || git commit -m "close: state update [skip ci]"
          git pull --rebase --autostash
          git push
