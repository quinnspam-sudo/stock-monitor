name: monitor

# Mirrors com.stockmonitor.monitor.plist: every 15 min, ~6:00-13:00 PT, Mon-Fri.
# Cron times below assume PDT (UTC-7). During PST (roughly Nov-Mar) runs land
# about an hour later than the equivalent local time — acceptable slack for
# this system, but adjust by 1hr if you want exact PT alignment year-round.
on:
  schedule:
    - cron: "0,15,30,45 13-19 * * 1-5"
    - cron: "0 20 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: stock-monitor-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python monitor.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Commit updated state
        run: |
          git config user.name "stock-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- . ':!venv' ':!__pycache__'
          git diff --cached --quiet || git commit -m "monitor: state update [skip ci]"
          git pull --rebase --autostash
          git push
