name: options

# Independent options engine — full-watchlist conviction-call scan.
# Triggered externally via cron-job.org calling this workflow's
# workflow_dispatch REST endpoint (same pattern as the other workflows;
# GitHub's native `schedule:` trigger doesn't fire on this repo).
#
# Cadence: once per trading day at 12:45 PT Mon-Fri (cron-job.org job
# "stock-monitor options", timezone America/Los_Angeles). Runs DURING
# market hours deliberately: option chain bid/ask are live (after-hours
# quotes degrade and would starve the contract-quality gate) and a
# conviction call is still actionable the same day. More frequent runs
# add API load without adding information — the judges use daily closes
# and same-day chain flow.
on:
  workflow_dispatch: {}

concurrency:
  group: stock-monitor-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: America/Los_Angeles
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python options_engine.py --discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_UPDATES_WEBHOOK_URL: ${{ secrets.DISCORD_UPDATES_WEBHOOK_URL }}
      - name: Commit updated state
        run: |
          git config user.name "stock-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "options: state update [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && break
            echo "push attempt $i failed, retrying..."
            sleep $((i * 5))
          done
