name: weekly

# Triggered externally via cron-job.org calling this workflow's
# workflow_dispatch REST endpoint on a schedule (see README) — GitHub's
# native `schedule:` trigger was silently not firing on this new
# account/repo (a known GitHub anti-abuse throttle on brand-new accounts),
# while manual/API dispatch worked reliably, so scheduling is now driven
# externally instead.

# Mirrors com.stockmonitor.weekly.plist: Friday 13:45 PT (verdicts vs SPY review).
on:
  workflow_dispatch: {}

concurrency:
  group: stock-monitor-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: America/Los_Angeles
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python weekly.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_UPDATES_WEBHOOK_URL: ${{ secrets.DISCORD_UPDATES_WEBHOOK_URL }}
      # Machine-vs-committee scorecard: is the human layer earning alpha over
      # the raw machine book, or are the mechanical gates doing all the work?
      - run: python signal_tracker.py report --days 90 --discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_UPDATES_WEBHOOK_URL: ${{ secrets.DISCORD_UPDATES_WEBHOOK_URL }}
      # Watchlist health: names with no price data or no fundamentals can
      # never alert — silent coverage gaps unless reported.
      - run: python watchlist_health.py --deep --discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_UPDATES_WEBHOOK_URL: ${{ secrets.DISCORD_UPDATES_WEBHOOK_URL }}
      - name: Commit updated state
        run: |
          git config user.name "stock-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          # Explicit allowlist, not `git add -A` — only files weekly.py,
          # signal_tracker.py, and watchlist_health.py are known to write.
          STATE_FILES="committee_prompts/ watchlist_health.json obsidian_queue.jsonl"
          git add $STATE_FILES
          git diff --cached --quiet || git commit -m "weekly: state update [skip ci]"
          pushed=""
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash && git push; then pushed=yes; break; fi
            # A conflicted rebase leaves unmerged files that doom every retry
            # (observed 2026-07-13: 5 identical failures, state silently lost,
            # job still green). Recover by rebuilding our state commit on top
            # of fresh remote: abort the rebase, move to origin/main keeping
            # our freshly-generated files staged, re-commit. State files are
            # regenerated every run, so ours winning is correct by design.
            git rebase --abort 2>/dev/null || true
            OLD=$(git rev-parse HEAD)
            FILES=$(git show --name-only --format= "$OLD")
            git fetch origin main
            git reset --hard origin/main
            # Restore ONLY the state files from our commit onto fresh remote —
            # never code (the CI checkout may be older than origin/main, and a
            # soft reset would silently revert newer code).
            if [ -n "$FILES" ]; then git checkout "$OLD" -- $FILES 2>/dev/null || true; fi
            git add $FILES
            git diff --cached --quiet || git commit -m "state update after conflict [skip ci]"
            echo "push attempt $i failed, retrying..."
            sleep $((i * 5))
          done
          if [ -z "$pushed" ]; then
            echo "::error::state commit could not be pushed after 5 attempts — state from this run is lost"
            exit 1
          fi
