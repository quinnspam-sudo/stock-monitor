name: weekly

# Mirrors com.stockmonitor.weekly.plist: Friday 13:45 PT (verdicts vs SPY review).
on:
  schedule:
    - cron: "45 20 * * 5"
  workflow_dispatch: {}

concurrency:
  group: stock-monitor-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python weekly.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Commit updated state
        run: |
          git config user.name "stock-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "weekly: state update [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && break
            echo "push attempt $i failed, retrying..."
            sleep $((i * 5))
          done
