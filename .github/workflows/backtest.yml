name: backtest

# Mirrors com.stockmonitor.backtest.plist (if present locally): Saturday 09:00 PT
# — backtests the local scoring engine's calls for the week just finished.
on:
  schedule:
    - cron: "0 16 * * 6"
  workflow_dispatch: {}

concurrency:
  group: stock-monitor-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python backtest.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Commit updated state
        run: |
          git config user.name "stock-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- . ':!venv' ':!__pycache__'
          git diff --cached --quiet || git commit -m "backtest: state update [skip ci]"
          git pull --rebase --autostash
          git push
